<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Parisienne&display=swap" rel="stylesheet">
<style>
/* Shared styles: butterflies + sparkles */
.bf{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;
  filter:drop-shadow(0 4px 8px rgba(80,20,90,.28))}
.bf svg{width:100%;height:100%;display:block;overflow:visible}
.wing{transform-origin:60px 48px;animation:flap var(--flap,.7s) ease-in-out infinite;animation-delay:var(--ph,0s)}
.wing.hw{animation-delay:calc(var(--ph,0s) + .07s)}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.16)}}
.spark{position:fixed;z-index:60;pointer-events:none;font-style:normal;font-size:20px;
  animation:spark 1s ease-out forwards}
@keyframes spark{from{transform:translate(-50%,-50%) scale(.4);opacity:1}
  to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.wing{animation-duration:1.2s}}

:root{--ink:#4a2a55;--rose:#d9468f;--soft:rgba(255,255,255,.72)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:"Nunito",system-ui,sans-serif;
  background:linear-gradient(160deg,#ffe3f1 0%,#ecdcff 50%,#d8ecff 100%);
  background-attachment:fixed;animation:enter 1.8s ease both;overflow-x:hidden}
@keyframes enter{from{opacity:0;filter:brightness(1.6)}to{opacity:1;filter:none}}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.heart{position:absolute;bottom:-30px;opacity:0;animation:rise linear infinite}
@keyframes rise{10%{opacity:.7}to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
main{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:0 18px 60px}

.hero{min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero .small{margin:0;font-weight:800;font-size:1.1rem;color:var(--rose)}
.hero h1{margin:.1em 0;font-family:"Parisienne",cursive;font-weight:400;line-height:1.05;
  font-size:clamp(3.6rem,17vw,7.5rem);color:var(--rose);text-shadow:0 6px 30px rgba(217,70,143,.3)}
.hero .tag{margin:0 0 28px;font-size:1.1rem;max-width:30ch}
.down{display:inline-block;padding:14px 26px;border-radius:99px;background:var(--rose);color:#fff;
  font-weight:800;text-decoration:none;box-shadow:0 8px 24px rgba(217,70,143,.4)}

.card{background:var(--soft);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:30px 8px 30px 8px;padding:clamp(22px,6vw,44px);box-shadow:0 18px 50px rgba(120,60,150,.18)}
.card p{margin:0 0 1.1em;font-size:1.12rem;line-height:1.85;max-width:60ch}
.sign{margin-top:1.6em;text-align:right}
.sign span{display:block;font-family:"Parisienne",cursive;font-size:2.4rem;color:var(--rose)}

#gallery h2{font-family:"Parisienne",cursive;font-weight:400;font-size:clamp(2.2rem,9vw,3.2rem);
  text-align:center;color:var(--rose);margin:70px 0 22px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.polaroid{margin:0;background:#fff;padding:8px 8px 0;border-radius:6px;cursor:zoom-in;
  box-shadow:0 10px 26px rgba(120,60,150,.2);transform:rotate(var(--rot));transition:transform .25s}
.polaroid:hover,.polaroid:focus-visible{transform:rotate(0) scale(1.04);outline:none}
.polaroid img,.polaroid .ph{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:3px}
.polaroid .ph{display:grid;place-items:center;background:linear-gradient(135deg,#ffc2e0,#d9c2ff);font-size:2.4rem}
.polaroid figcaption{padding:10px 4px 12px;text-align:center;font-size:.95rem;font-weight:600}

.reveal{opacity:0;transform:translateY(24px);transition:opacity .9s,transform .9s}
.reveal.in{opacity:1;transform:none}

#music{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:30;width:54px;height:54px;
  border-radius:50%;border:0;background:var(--rose);color:#fff;font-size:1.2rem;cursor:pointer;
  box-shadow:0 6px 20px rgba(217,70,143,.5)}
#music.nudge{animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.18);box-shadow:0 0 0 12px rgba(217,70,143,.2)}}
#toast{position:fixed;top:max(76px,calc(env(safe-area-inset-top) + 62px));right:14px;z-index:30;
  background:#fff;padding:8px 14px;border-radius:14px;font-weight:700;font-size:.9rem;
  box-shadow:0 6px 20px rgba(0,0,0,.15);opacity:0;transition:opacity .4s;pointer-events:none}
#toast.show{opacity:1}

#lightbox{position:fixed;inset:0;z-index:40;background:rgba(40,10,60,.86);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:100%;max-height:78vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#lightbox p{margin:0;color:#fff;font-weight:700}
@media(prefers-reduced-motion:reduce){.reveal{transition:none;opacity:1;transform:none}.heart{display:none}}

</style>
</head>
<body>
  <!-- PAGE 2: everything you read here comes from config.js (name, message, photos, song) -->
  <audio id="song" loop preload="auto"></audio>
  <button id="music" type="button" aria-label="Play or pause music">▶</button>
  <div id="toast">Tap ▶ for music 🎶</div>
  <div id="sky"></div>
  <main>
    <section class="hero">
      <p class="small">✨ Happy Birthday ✨</p>
      <h1 id="name"></h1>
      <p class="tag" id="tag"></p>
      <a class="down" href="#msg">Read my message 💌</a>
    </section>
    <section class="card reveal" id="msg"></section>
    <section id="gallery">
      <h2>Our little memories</h2>
      <div class="grid" id="grid"></div>
    </section>
  </main>
  <div id="lightbox"><img alt=""><p></p></div>
  <script src="config.js"></script>
  <script>
/* Shared butterfly drawing + flying engine (used by both pages). No need to edit. */
const BF_COLORS = [   // a = center color, b = outer color, e = dark border/veins, s = spot color, tail = swallowtail tails
  { a: "#ffb347", b: "#e8590c", e: "#1d1218", s: "#fff", tail: false },   // monarch
  { a: "#9fe0ff", b: "#1f6fe8", e: "#0b1b3a", s: "#dff4ff", tail: false }, // blue morpho
  { a: "#fff08a", b: "#f2b705", e: "#1d1218", s: "#fff8cc", tail: true },  // swallowtail
  { a: "#ffd0ec", b: "#e8559f", e: "#4a1d4a", s: "#fff", tail: false },    // pink
  { a: "#ead2ff", b: "#9b5de5", e: "#2b1a4a", s: "#fff", tail: true },     // violet
  { a: "#c5f8e0", b: "#27b389", e: "#0f2e2a", s: "#fff", tail: true }      // emerald
];

let _bid = 0;
function butterflySVG(c) {
  const id = "bw" + (_bid++);
  const FW = "M60 46C64 30 80 8 106 6C116 6 119 16 114 28C109 42 94 52 76 54C68 55 62 52 60 50Z";
  const HW = c.tail
    ? "M60 50C76 51 98 56 100 70C101 80 94 84 88 82C86 90 84 96 76 96C79 90 78 84 74 80C66 74 61 64 60 54Z"
    : "M60 50C76 51 98 56 100 72C101 84 90 90 80 84C70 78 62 66 60 54Z";
  const FV = "M62 48L106 10M62 48L112 22M62 48L108 38M62 48L92 50M62 48L100 30";
  const HV = "M62 52L96 60M62 52L98 72M62 52L88 84M62 52L76 78";
  const dot = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c.s}" opacity=".9"/>`;
  const FS = dot(104, 10, 2.2) + dot(110, 17, 1.8) + dot(111, 25, 2) + dot(108, 34, 1.7) + dot(100, 43, 1.8) + dot(88, 50, 1.5);
  const HS = dot(96, 66, 1.7) + dot(96, 76, 1.6) + dot(88, 81, 1.5) + dot(78, 78, 1.3);
  const part = (d, cl, veins, spots, shine) =>
    `<path d="${d}" fill="url(#${id}g)"/>` +
    `<g clip-path="url(#${id}${cl})">` +
      `<path d="${veins}" stroke="${c.e}" stroke-opacity=".45" stroke-width=".9" fill="none"/>` +
      shine +
      `<path d="${d}" fill="none" stroke="${c.e}" stroke-width="9" stroke-linejoin="round"/>` + spots +
    `</g><path d="${d}" fill="none" stroke="${c.e}" stroke-width="1.3" stroke-linejoin="round"/>`;
  const fw = part(FW, "f", FV, FS, `<ellipse cx="76" cy="38" rx="15" ry="6" fill="#fff" opacity=".2" transform="rotate(-32 76 38)"/>`);
  const hw = part(HW, "h", HV, HS, `<ellipse cx="78" cy="62" rx="12" ry="5" fill="#fff" opacity=".16" transform="rotate(25 78 62)"/>`);
  const L = x => `<g transform="translate(120 0) scale(-1 1)">${x}</g>`;
  return `<svg viewBox="0 0 120 96" aria-hidden="true"><defs>` +
    `<radialGradient id="${id}g" gradientUnits="userSpaceOnUse" cx="60" cy="50" r="58"><stop offset="0" stop-color="${c.a}"/><stop offset="1" stop-color="${c.b}"/></radialGradient>` +
    `<clipPath id="${id}f"><path d="${FW}"/></clipPath><clipPath id="${id}h"><path d="${HW}"/></clipPath></defs>` +
    `<g class="wing hw">${hw}</g><g class="wing hw">${L(hw)}</g>` +
    `<g class="wing fw">${fw}</g><g class="wing fw">${L(fw)}</g>` +
    `<ellipse cx="60" cy="62" rx="2.7" ry="13" fill="#2a1820"/>` +
    `<path d="M57.6 56H62.4M57.8 61H62.2M58 66H62M58.4 71H61.6" stroke="#6a4558" stroke-width=".8"/>` +
    `<ellipse cx="60" cy="45" rx="3.7" ry="7" fill="#3a2230"/><circle cx="60" cy="34" r="3.4" fill="#2a1820"/>` +
    `<path d="M58.8 31C56 22 50 16 45 14M61.2 31C64 22 70 16 75 14" stroke="#2a1820" stroke-width="1" fill="none" stroke-linecap="round"/>` +
    `<circle cx="45" cy="14" r="1.7" fill="#2a1820"/><circle cx="75" cy="14" r="1.7" fill="#2a1820"/></svg>`;
}

const _flyers = [];
let _last = 0, _running = false;

function _pick(f) {
  const W = innerWidth, H = innerHeight, a = f.area;
  f.tx = f.size / 2 + Math.random() * (W - f.size);
  f.ty = H * a.top + Math.random() * H * (a.bottom - a.top);
}

function createButterfly(parent, o) {
  const el = document.createElement("div");
  el.className = "bf" + (o.special ? " special" : "");
  el.style.width = o.size + "px";
  el.style.height = o.size * 0.8 + "px";
  el.style.setProperty("--flap", (0.5 + Math.random() * 0.3) + "s");
  el.style.setProperty("--ph", (-Math.random()) + "s");
  el.innerHTML = butterflySVG(o.colors) +
    (o.special ? '<span class="halo"></span><span class="hit"></span>' : "");
  parent.appendChild(el);
  const f = {
    el, size: o.size, speed: o.speed, t: Math.random() * 50,
    area: o.area || { top: 0.08, bottom: 0.85 },
    x: Math.random() * innerWidth, y: innerHeight * (0.1 + Math.random() * 0.6),
    ang: Math.random() * 6.28
  };
  _pick(f);
  _flyers.push(f);
  if (!_running) { _running = true; _last = performance.now(); requestAnimationFrame(_loop); }
  return f;
}

function _loop(now) {
  const dt = Math.min(0.05, (now - _last) / 1000 || 0.016);
  _last = now;
  for (const f of _flyers) {
    f.t += dt;
    const dx = f.tx - f.x, dy = f.ty - f.y;
    if (Math.hypot(dx, dy) < 40) _pick(f);
    const diff = ((Math.atan2(dy, dx) - f.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    f.ang += diff * Math.min(1, dt * 1.6);
    const sp = f.speed * (0.75 + 0.25 * Math.sin(f.t * 2.1));
    f.x += Math.cos(f.ang) * sp * dt;
    f.y += Math.sin(f.ang) * sp * dt + Math.sin(f.t * 3) * 14 * dt;
    f.x = Math.max(0, Math.min(innerWidth, f.x));
    f.y = Math.max(0, Math.min(innerHeight, f.y));
    f.el.style.transform =
      `translate3d(${f.x - f.size / 2}px,${f.y - f.size * 0.4}px,0) rotate(${Math.cos(f.ang) * 14}deg)`;
  }
  requestAnimationFrame(_loop);
}

/* Page 2 logic: fills the page from config.js, floats butterflies, plays music. */
(function () {
  const $ = id => document.getElementById(id);
  document.title = "Happy Birthday, " + CONFIG.name + " 💗";
  $("name").textContent = CONFIG.name;
  $("tag").textContent = CONFIG.tagline;

  const msg = $("msg");
  CONFIG.message.forEach(t => { const p = document.createElement("p"); p.textContent = t; msg.appendChild(p); });
  const sign = document.createElement("div"); sign.className = "sign";
  sign.innerHTML = "<span></span>"; sign.firstChild.textContent = CONFIG.signOff;
  sign.appendChild(document.createTextNode(CONFIG.from)); msg.appendChild(sign);

  // ----- Gallery -----
  const grid = $("grid"), box = $("lightbox"), bimg = box.querySelector("img"), bcap = box.querySelector("p");
  CONFIG.photos.forEach((ph, i) => {
    const fig = document.createElement("figure"); fig.className = "polaroid reveal"; fig.tabIndex = 0;
    fig.style.setProperty("--rot", (i % 2 ? 1.8 : -1.8) + "deg");
    const img = new Image(); img.loading = "lazy"; img.alt = ph.caption; img.src = ph.src;
    img.onerror = () => { const d = document.createElement("div"); d.className = "ph"; d.textContent = "💗"; img.replaceWith(d); };
    const cap = document.createElement("figcaption"); cap.textContent = ph.caption;
    fig.append(img, cap); grid.appendChild(fig);
    const open = () => { if (!img.isConnected) return; bimg.src = ph.src; bcap.textContent = ph.caption; box.classList.add("open"); };
    fig.addEventListener("click", open);
    fig.addEventListener("keydown", e => { if (e.key === "Enter") open(); });
  });
  box.addEventListener("click", () => box.classList.remove("open"));
  addEventListener("keydown", e => { if (e.key === "Escape") box.classList.remove("open"); });

  // ----- Soft reveal on scroll -----
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: 0.15 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));

  // ----- Floating butterflies + rising hearts -----
  const sky = $("sky"), w = innerWidth;
  for (let i = 0; i < (w < 600 ? 5 : 8); i++)
    createButterfly(sky, { size: 54 + Math.random() * 40, colors: BF_COLORS[i % 6], speed: 28 + Math.random() * 30, area: { top: 0.02, bottom: 0.95 } });
  for (let i = 0; i < 14; i++) {
    const h = document.createElement("span"); h.className = "heart"; h.textContent = ["💗", "🌸", "✨", "💖"][i % 4];
    h.style.cssText = `left:${Math.random() * 100}%;font-size:${14 + Math.random() * 16}px;animation-duration:${12 + Math.random() * 12}s;animation-delay:${-Math.random() * 20}s`;
    sky.appendChild(h);
  }

  // ----- Music -----
  const audio = $("song"), btn = $("music"), toast = $("toast"); let userPaused = false;
  audio.src = CONFIG.song; audio.volume = 0.7;
  const sync = () => { btn.textContent = audio.paused ? "▶" : "❚❚"; btn.classList.toggle("nudge", audio.paused && !userPaused); };
  audio.addEventListener("play", sync); audio.addEventListener("pause", sync);
  btn.addEventListener("click", e => { e.stopPropagation(); if (audio.paused) { userPaused = false; audio.play().catch(() => {}); } else { userPaused = true; audio.pause(); } });
  sync();
  audio.play().catch(() => {   // browsers may block autoplay: start on the first tap instead
    toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 5000);
    document.addEventListener("pointerdown", e => { if (audio.paused && !userPaused && !btn.contains(e.target)) audio.play().catch(() => {}); }, { once: true });
  });
})();

</script>
</body>
</html>
