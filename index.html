<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little surprise 🦋</title>
<!-- Fonts load from Google when online; the page still works with fallback fonts if offline -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Parisienne&display=swap" rel="stylesheet">
<style>
/* Shared styles: butterflies + sparkles */
.bf{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;
  filter:drop-shadow(0 4px 8px rgba(80,20,90,.28))}
.bf svg{width:100%;height:100%;display:block;overflow:visible}
.wing{transform-origin:50px 40px;animation:flap var(--flap,.45s) ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.2)}}
.spark{position:fixed;z-index:60;pointer-events:none;font-style:normal;font-size:20px;
  animation:spark 1s ease-out forwards}
@keyframes spark{from{transform:translate(-50%,-50%) scale(.4);opacity:1}
  to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.wing{animation-duration:1.2s}}

html,body{margin:0;height:100%;overflow:hidden;background:#5b4bb7;
  font-family:"Nunito",system-ui,sans-serif;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#scene,#sky{position:fixed;inset:0;width:100%;height:100%}
#sky{overflow:hidden}
.bf.special{pointer-events:auto;cursor:pointer;z-index:5;
  filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 26px #ffc4ea)}
.bf.special .hit{position:absolute;inset:-30px;border-radius:50%}
.bf.special .halo{position:absolute;inset:-22%;border-radius:50%;z-index:-1;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.6),rgba(255,180,230,.28) 50%,transparent 70%);
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25);opacity:.6}}
.bf.special.found{pointer-events:none;
  filter:drop-shadow(0 0 14px #ffe28a) drop-shadow(0 0 30px #ffd24d)}
.bf.special.found .halo{animation:none;background:radial-gradient(circle,rgba(255,238,150,.75),transparent 70%)}

#hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:0;right:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#dots{display:flex;gap:10px;padding:8px 16px;border-radius:99px;
  background:rgba(255,255,255,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-sizing:border-box;
  transition:.4s}
.dot.on{background:#ffe28a;border-color:#ffe28a;box-shadow:0 0 14px #ffd24d;transform:scale(1.2)}
#hint{margin:0;padding:0 16px;color:#fff;font-weight:700;font-size:1rem;text-align:center;
  text-shadow:0 2px 10px rgba(60,20,100,.6)}

#magic{position:fixed;inset:0;z-index:50;pointer-events:none;display:grid;place-items:center;
  background:radial-gradient(circle,#fff 0%,#ffd1ec 45%,#c9a7ff 100%);
  clip-path:circle(0% at 50% 50%);transition:clip-path 1.6s cubic-bezier(.6,0,.2,1)}
#magic.on{clip-path:circle(150% at 50% 50%);pointer-events:all}
#magic p{margin:0;font-family:"Parisienne",cursive;font-size:clamp(2.6rem,12vw,5rem);
  color:#a23c8f;opacity:0;transition:opacity .8s 1s}
#magic.on p{opacity:1}

</style>
</head>
<body>
  <!-- PAGE 1: the butterfly garden. Text of the hint is set in config.js (gardenHint) -->
  <canvas id="scene"></canvas>
  <div id="sky"></div>
  <div id="hud">
    <div id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <p id="hint"></p>
  </div>
  <div id="magic"><p>Surprise!</p></div>
  <script src="config.js"></script>
  <script>
/* Shared butterfly drawing + flying engine (used by both pages). No need to edit. */
const BF_COLORS = [
  ["#ff7eb6", "#ffb3d9"], ["#8ec5ff", "#c9e4ff"], ["#c79bff", "#e6d1ff"],
  ["#ffd36e", "#ffeaa8"], ["#7ef0d0", "#c2fbe9"], ["#ff9a8b", "#ffc9bf"]
];

function butterflySVG(c1, c2) {
  const wing =
    `<path d="M50 42C38 8 6 0 6 28c0 14 18 22 44 16z" fill="${c1}"/>` +
    `<path d="M50 44C30 48 12 58 22 72c12 10 28-8 28-28z" fill="${c2}"/>` +
    `<circle cx="26" cy="26" r="6" fill="#fff" opacity=".55"/>` +
    `<circle cx="26" cy="64" r="3.5" fill="#fff" opacity=".55"/>` +
    `<path d="M50 42C38 8 6 0 6 28c0 14 18 22 44 16z" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/>`;
  return `<svg viewBox="0 0 100 80" aria-hidden="true">` +
    `<g class="wing"><g>${wing}</g></g>` +
    `<g class="wing"><g transform="translate(100 0) scale(-1 1)">${wing}</g></g>` +
    `<rect x="48.5" y="30" width="3" height="24" rx="1.5" fill="#5a3a63"/>` +
    `<path d="M49.5 31C47 24 44 22 42 21M50.5 31C53 24 56 22 58 21" stroke="#5a3a63" stroke-width="1" fill="none" stroke-linecap="round"/></svg>`;
}

const _flyers = [];
let _last = 0, _running = false;

function _pick(f) {
  const W = innerWidth, H = innerHeight, a = f.area;
  f.tx = f.size / 2 + Math.random() * (W - f.size);
  f.ty = H * a.top + Math.random() * H * (a.bottom - a.top);
}

function createButterfly(parent, o) {
  const el = document.createElement("div");
  el.className = "bf" + (o.special ? " special" : "");
  el.style.width = o.size + "px";
  el.style.height = o.size * 0.8 + "px";
  el.style.setProperty("--flap", (0.32 + Math.random() * 0.25) + "s");
  el.innerHTML = butterflySVG(o.colors[0], o.colors[1]) +
    (o.special ? '<span class="halo"></span><span class="hit"></span>' : "");
  parent.appendChild(el);
  const f = {
    el, size: o.size, speed: o.speed, t: Math.random() * 50,
    area: o.area || { top: 0.08, bottom: 0.85 },
    x: Math.random() * innerWidth, y: innerHeight * (0.1 + Math.random() * 0.6),
    ang: Math.random() * 6.28
  };
  _pick(f);
  _flyers.push(f);
  if (!_running) { _running = true; _last = performance.now(); requestAnimationFrame(_loop); }
  return f;
}

function _loop(now) {
  const dt = Math.min(0.05, (now - _last) / 1000 || 0.016);
  _last = now;
  for (const f of _flyers) {
    f.t += dt;
    const dx = f.tx - f.x, dy = f.ty - f.y;
    if (Math.hypot(dx, dy) < 40) _pick(f);
    const diff = ((Math.atan2(dy, dx) - f.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    f.ang += diff * Math.min(1, dt * 1.6);
    const sp = f.speed * (0.75 + 0.25 * Math.sin(f.t * 2.1));
    f.x += Math.cos(f.ang) * sp * dt;
    f.y += Math.sin(f.ang) * sp * dt + Math.sin(f.t * 3) * 14 * dt;
    f.x = Math.max(0, Math.min(innerWidth, f.x));
    f.y = Math.max(0, Math.min(innerHeight, f.y));
    f.el.style.transform =
      `translate3d(${f.x - f.size / 2}px,${f.y - f.size * 0.4}px,0) rotate(${Math.cos(f.ang) * 14}deg)`;
  }
  requestAnimationFrame(_loop);
}

/* Page 1 logic: paints the flower garden, spawns butterflies, handles the 3 clicks. */
(function () {
  const cv = document.getElementById("scene"), ctx = cv.getContext("2d");
  const sky = document.getElementById("sky"), hint = document.getElementById("hint");
  const dots = [...document.querySelectorAll(".dot")], magic = document.getElementById("magic");
  const TOTAL = 3;
  let W, H, dpr, bg, lights = [];

  hint.textContent = CONFIG.gardenHint;

  function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  function flower(g, x, y, s, r) {
    const h = [330, 350, 12, 45, 285, 262, 200, 170][Math.floor(r() * 8)];
    const sh = (70 + r() * 80) * s, hx = x + (r() - 0.5) * 30 * s, hy = y - sh;
    g.strokeStyle = "#2f9b62"; g.lineWidth = 2.6 * s; g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + (hx - x) * 1.4, y - sh * 0.5, hx, hy); g.stroke();
    g.fillStyle = "#3fb774"; g.beginPath(); g.ellipse(x + 7 * s, y - sh * 0.35, 9 * s, 4 * s, -0.6, 0, 7); g.fill();
    const n = 5 + Math.floor(r() * 4), L = (15 + r() * 10) * s;
    for (let i = 0; i < n; i++) {
      g.save(); g.translate(hx, hy); g.rotate(i * 6.283 / n);
      g.fillStyle = `hsl(${h},85%,${72 + (i % 2) * 6}%)`;
      g.beginPath(); g.ellipse(0, -L * 0.75, L * 0.4, L * 0.78, 0, 0, 7); g.fill(); g.restore();
    }
    g.shadowColor = "#ffe9a0"; g.shadowBlur = 10 * s; g.fillStyle = "#ffd966";
    g.beginPath(); g.arc(hx, hy, L * 0.3, 0, 7); g.fill(); g.shadowBlur = 0;
  }

  function blade(g, x, y, hgt, r) {
    g.strokeStyle = `hsl(${120 + r() * 30},55%,${28 + r() * 18}%)`; g.lineWidth = 1.5 + r() * 2;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + (r() - 0.5) * 16, y - hgt * 0.6, x + (r() - 0.5) * 26, y - hgt); g.stroke();
  }

  function build() {
    dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    bg = document.createElement("canvas"); bg.width = cv.width; bg.height = cv.height;
    const g = bg.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const r = rng(7);
    const sk = g.createLinearGradient(0, 0, 0, H * 0.62);
    [[0, "#5b4bb7"], [0.4, "#c77dd6"], [0.75, "#ff9fcf"], [1, "#ffd8b5"]].forEach(c => sk.addColorStop(c[0], c[1]));
    g.fillStyle = sk; g.fillRect(0, 0, W, H);
    const sun = g.createRadialGradient(W * 0.7, H * 0.5, 0, W * 0.7, H * 0.5, H * 0.4);
    sun.addColorStop(0, "rgba(255,245,200,.9)"); sun.addColorStop(1, "rgba(255,245,200,0)");
    g.fillStyle = sun; g.fillRect(0, 0, W, H);
    g.fillStyle = "#86d7ae"; g.beginPath(); g.moveTo(0, H * 0.56);
    g.bezierCurveTo(W * 0.3, H * 0.47, W * 0.6, H * 0.6, W, H * 0.5); g.lineTo(W, H); g.lineTo(0, H); g.fill();
    const gr = g.createLinearGradient(0, H * 0.5, 0, H);
    gr.addColorStop(0, "#5fd18b"); gr.addColorStop(1, "#1f7a55");
    g.fillStyle = gr; g.beginPath(); g.moveTo(0, H * 0.6);
    g.bezierCurveTo(W * 0.35, H * 0.54, W * 0.65, H * 0.64, W, H * 0.57); g.lineTo(W, H); g.lineTo(0, H); g.fill();
    for (let row = 0; row < 9; row++) {
      const t = row / 8, y = H * 0.62 + Math.pow(t, 1.3) * H * 0.4, s = 0.45 + t * 1.1;
      for (let k = 0; k < W / 9; k++) blade(g, r() * W, y, (14 + r() * 16) * s, r);
      const n = Math.ceil(W / (80 * s));
      for (let k = 0; k < n; k++) flower(g, (k + r()) * W / n, y + r() * 10, s, r);
    }
    for (let k = 0; k < W / 4; k++) blade(g, r() * W, H + 6, 24 + r() * 60, r);
    lights = [];
    const n = Math.max(25, Math.min(70, W / 14));
    for (let i = 0; i < n; i++) lights.push({ x: Math.random() * W, y: H * (0.1 + Math.random() * 0.9),
      r: 2 + Math.random() * 4, vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 10,
      ph: Math.random() * 9, c: Math.random() < 0.6 ? "255,236,150" : "255,190,235" });
    for (let i = 0; i < 8; i++) lights.push({ x: Math.random() * W, y: Math.random() * H * 0.5,
      r: 14 + Math.random() * 22, vx: 4, vy: 2, ph: Math.random() * 9, c: "255,255,255", big: 1 });
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    ctx.globalCompositeOperation = "source-over";
    ctx.drawImage(bg, 0, 0, W * dpr, H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalCompositeOperation = "lighter";
    for (const p of lights) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.ph += dt * (p.big ? 0.6 : 2);
      if (p.x < -40) p.x = W + 40; if (p.x > W + 40) p.x = -40;
      if (p.y < -40) p.y = H + 40; if (p.y > H + 40) p.y = -40;
      const a = (p.big ? 0.12 : 0.35) + (p.big ? 0.06 : 0.45) * (0.5 + 0.5 * Math.sin(p.ph));
      const gd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * (p.big ? 1 : 3));
      gd.addColorStop(0, `rgba(${p.c},${a})`); gd.addColorStop(1, `rgba(${p.c},0)`);
      ctx.fillStyle = gd; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (p.big ? 1 : 3), 0, 7); ctx.fill();
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0); requestAnimationFrame(frame);
  }

  function burst(x, y, n) {
    const e = ["✨", "💗", "🌸", "✦"];
    for (let i = 0; i < n; i++) {
      const s = document.createElement("i"), a = Math.random() * 6.283, d = 40 + Math.random() * 90;
      s.className = "spark"; s.textContent = e[i % 4];
      s.style.cssText = `left:${x}px;top:${y}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px`;
      document.body.appendChild(s); setTimeout(() => s.remove(), 1000);
    }
  }

  let found = 0;
  function onFound(el, e) {
    if (el.dataset.found) return; el.dataset.found = 1; el.classList.add("found");
    burst(e.clientX, e.clientY, 14); dots[found].classList.add("on"); found++;
    if (found < TOTAL) { hint.textContent = `Found ${found} of ${TOTAL} 💗 keep going!`; return; }
    hint.textContent = "You found them all! ✨";
    setTimeout(() => { magic.classList.add("on");
      for (let i = 0; i < 6; i++) setTimeout(() => burst(Math.random() * W, Math.random() * H, 8), i * 200); }, 600);
    setTimeout(() => { location.href = "main.html"; }, 3300);
  }

  build(); requestAnimationFrame(frame);
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(build, 200); });

  const big = Math.min(130, Math.max(92, innerWidth * 0.24));
  const small = Math.min(95, Math.max(62, innerWidth * 0.17));
  for (let i = 0; i < 6; i++)
    createButterfly(sky, { size: small * (0.8 + Math.random() * 0.4), colors: BF_COLORS[i % 6], speed: 60 + Math.random() * 40 });
  for (let i = 0; i < TOTAL; i++) {
    const f = createButterfly(sky, { size: big, colors: BF_COLORS[(i * 2 + 1) % 6], speed: 42 + i * 6, special: true,
      area: { top: 0.18, bottom: 0.72 } });
    f.el.addEventListener("pointerdown", e => { e.preventDefault(); onFound(f.el, e); });
  }
})();

</script>
</body>
</html>
