<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A letter for you 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Parisienne&display=swap" rel="stylesheet">
<style>
/* Shared styles: butterflies + sparkles */
.bf{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;
  filter:drop-shadow(0 4px 8px rgba(80,20,90,.28))}
.bf svg{width:100%;height:100%;display:block;overflow:visible}
.wing{transform-origin:50px 40px;animation:flap var(--flap,.45s) ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.2)}}
.spark{position:fixed;z-index:60;pointer-events:none;font-style:normal;font-size:20px;
  animation:spark 1s ease-out forwards}
@keyframes spark{from{transform:translate(-50%,-50%) scale(.4);opacity:1}
  to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.wing{animation-duration:1.2s}}

/* Theme (same as main.html) */
:root{--ink:#4a2a55;--rose:#d9468f;--soft:rgba(255,255,255,.72)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{color:var(--ink);font-family:"Nunito",system-ui,sans-serif;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  background:linear-gradient(160deg,#ffe3f1 0%,#ecdcff 50%,#d8ecff 100%);
  background-attachment:fixed;animation:enter 1.8s ease both;transition:opacity .7s}
body.leave{opacity:0}
@keyframes enter{from{opacity:0;filter:brightness(1.6)}to{opacity:1;filter:none}}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.heart{position:absolute;bottom:-30px;opacity:0;animation:rise linear infinite}
@keyframes rise{10%{opacity:.7}to{transform:translateY(-110vh) rotate(25deg);opacity:0}}

#hint{position:fixed;top:max(18px,calc(env(safe-area-inset-top) + 8px));left:0;right:0;z-index:20;
  margin:0;padding:0 16px;text-align:center;font-weight:800;font-size:1.05rem;color:var(--rose);
  text-shadow:0 2px 12px rgba(255,255,255,.9);pointer-events:none;transition:opacity .5s}

/* ---------- The window ---------- */
#win{position:absolute;z-index:3;perspective:1100px}
.view{position:absolute;inset:0;border-radius:30px 30px 6px 6px;overflow:hidden;
  background:linear-gradient(180deg,#5b4bb7 0%,#c77dd6 40%,#ff9fcf 72%,#ffd8b5 100%)}
.view::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 70% 62%,rgba(255,245,200,.9),rgba(255,245,200,0) 45%)}
.hill{position:absolute;left:-20%;width:140%;border-radius:50% 50% 0 0/100% 100% 0 0}
.hill.a{bottom:-8%;height:34%;background:linear-gradient(#86d7ae,#5fd18b)}
.hill.b{bottom:-14%;height:26%;background:linear-gradient(#5fd18b,#1f7a55)}
.blooms{position:absolute;left:0;right:0;bottom:2%;display:flex;justify-content:space-around;font-size:22px}
.tw{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffec96;
  box-shadow:0 0 10px 3px rgba(255,236,150,.8);animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.25;transform:scale(.6)}}
.frame{position:absolute;inset:-12px;border-radius:38px 38px 10px 10px;border:12px solid #fff;
  box-shadow:0 18px 50px rgba(120,60,150,.28),inset 0 0 0 2px rgba(217,70,143,.25);
  pointer-events:none;z-index:5}
.sill{position:absolute;left:-30px;right:-30px;bottom:-32px;height:16px;border-radius:8px;background:#fff;
  box-shadow:0 8px 20px rgba(120,60,150,.25);z-index:5}
.sash{position:absolute;top:0;bottom:0;width:50%;z-index:3;border:5px solid #fff;
  background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.05) 40%,rgba(255,255,255,.2));
  transition:transform 1.5s cubic-bezier(.4,.1,.2,1)}
.sash::before{content:"";position:absolute;left:0;right:0;top:50%;height:5px;margin-top:-2.5px;background:#fff}
.sash.l{left:0;transform-origin:left center;border-radius:30px 0 0 0}
.sash.r{right:0;transform-origin:right center;border-radius:0 30px 0 0}
#win.open .sash.l{transform:rotateY(-98deg)}
#win.open .sash.r{transform:rotateY(98deg)}
.pole{position:absolute;left:-8%;right:-8%;top:-48px;height:9px;border-radius:9px;background:var(--rose);
  box-shadow:0 4px 10px rgba(217,70,143,.35);z-index:6}
.curtain{position:absolute;top:-40px;width:56%;height:calc(100% + 78px);z-index:6;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,196,228,.97) 0 13px,rgba(255,166,210,.97) 13px 26px);
  box-shadow:0 10px 30px rgba(120,60,150,.22);transition:transform 1.5s cubic-bezier(.5,0,.2,1)}
.curtain.l{left:-8%;transform-origin:left top;border-radius:0 0 30px 6px}
.curtain.r{right:-8%;transform-origin:right top;border-radius:0 0 6px 30px}
#win.curtains-open .curtain{transform:scaleX(.3)}

/* ---------- Butterfly + envelope ---------- */
#stage{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden}
#stage .bf.carrier{filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 22px #ffc4ea)}
#env{position:absolute;left:0;top:0;width:130px;height:90px;padding:0;border:0;background:none;
  opacity:0;z-index:1;pointer-events:none;transform-origin:center;cursor:pointer;
  filter:drop-shadow(0 10px 14px rgba(120,60,150,.3))}
#env.ready{pointer-events:auto;animation:glow 1.6s ease-in-out infinite}
#env:focus-visible{outline:3px solid var(--rose);outline-offset:6px}
@keyframes glow{50%{filter:drop-shadow(0 0 16px #fff) drop-shadow(0 0 30px rgba(217,70,143,.6))}}
.env-body{position:absolute;inset:0;border-radius:8px;border:1.5px solid rgba(217,70,143,.35);
  background:
   linear-gradient(to top right,transparent 48%,rgba(217,70,143,.28) 50%,transparent 52%) left bottom/50% 70% no-repeat,
   linear-gradient(to top left,transparent 48%,rgba(217,70,143,.28) 50%,transparent 52%) right bottom/50% 70% no-repeat,
   linear-gradient(160deg,#fff,#ffe3f1)}
.flap{position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(#ffc2e0,#ffa6d0);
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease}
#env.open .flap{transform:perspective(400px) rotateX(180deg)}
.seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;transition:opacity .3s}
#env.open .seal{opacity:0}

/* ---------- The letter ---------- */
#paper{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;
  background:rgba(80,30,100,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .6s}
#paper.show{opacity:1;pointer-events:auto}
.card{background:var(--soft);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:30px 8px 30px 8px;padding:clamp(22px,6vw,40px);box-shadow:0 18px 50px rgba(120,60,150,.18);
  width:min(92vw,520px);max-height:88vh;overflow:auto;
  transform:translateY(60px) scale(.88) rotate(-2deg);transition:transform .9s cubic-bezier(.2,.9,.3,1.15)}
#paper.show .card{transform:none}
.card h2{margin:0 0 .3em;font-family:"Parisienne",cursive;font-weight:400;font-size:clamp(2.4rem,10vw,3.2rem);color:var(--rose)}
.card p{margin:0 0 1.1em;font-size:1.12rem;line-height:1.85;max-width:60ch}
.down{display:inline-block;padding:14px 26px;border-radius:99px;background:var(--rose);color:#fff;border:0;
  font:inherit;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(217,70,143,.4)}
.down:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.cta{text-align:center;margin-top:.6em}

@media(prefers-reduced-motion:reduce){.heart{display:none}.sash,.curtain{transition-duration:.01s}}
</style>
</head>
<body>
  <!-- PAGE 2 (new): the butterfly brings a letter through the window. Texts come from config.js -->
  <div id="sky"></div>
  <p id="hint"></p>

  <div id="win">
    <div class="pole"></div>
    <div class="curtain l"></div><div class="curtain r"></div>
    <div class="view" id="view">
      <div class="hill a"></div><div class="hill b"></div>
      <div class="blooms"><span>🌸</span><span>🌷</span><span>🌼</span><span>🌸</span><span>🌷</span></div>
    </div>
    <div class="sash l"></div><div class="sash r"></div>
    <div class="frame"></div>
    <div class="sill"></div>
  </div>

  <div id="stage">
    <button id="env" type="button" aria-label="Open the letter">
      <span class="env-body"></span><span class="flap"></span><span class="seal">💗</span>
    </button>
  </div>

  <div id="paper" aria-live="polite">
    <div class="card" id="card"></div>
  </div>

  <script src="config.js"></script>
  <script>
/* Shared butterfly drawing: realistic species-style butterflies (morpho blue, monarch, yellow, cyan, red/teal, purple). */
const BF_COLORS = [
  { fw: ["#3db0ff", "#0a2c86"], hw: ["#7a86ff", "#2a1a8a"], edge: "#0b1130", dot: "#fff", band: "#eaf7ff" },
  { fw: ["#ffa22a", "#e85d08"], hw: ["#ffb94a", "#ee7410"], edge: "#1b1008", dot: "#fff", veins: "#1b1008" },
  { fw: ["#fff06a", "#e6b400"], hw: ["#fff58a", "#f0c000"], edge: "#3b2a0a", dot: "#fff7b0", veins: "#3b2a0a", stripes: 1 },
  { fw: ["#b8f1ff", "#35a5df"], hw: ["#c9f6ff", "#4bb7e8"], edge: "#14405e", dot: "#fff", veins: "#14405e" },
  { fw: ["#ff5252", "#7d0c22"], hw: ["#35e6c4", "#0a7d8c"], edge: "#2a0a12", dot: "#fff", tail: 1 },
  { fw: ["#b078ff", "#2c3fd6"], hw: ["#8a66ff", "#3a1d9a"], edge: "#1a1040", dot: "#fff", speck: 1 }
];

let _bfUid = 0;
function butterflySVG(c) {
  const id = "bf" + (_bfUid++);
  const FW = "M50 41C46 24 30 6 10 7C4 8 4 15 7 21C12 32 30 43 50 44Z";
  const HW = "M50 43C36 44 21 49 19 61C18 71 31 74 41 66C47 60 51 52 50 43Z";
  const dots = (pts, r) => pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${c.dot}" opacity=".9"/>`).join("");
  const wing =
    (c.tail ? `<path d="M41 66C38 74 36 78 33 79C41 79 47 72 48 62Z" fill="${c.edge}"/>` : "") +
    `<path d="${HW}" fill="url(#${id}h)"/>` +
    `<path d="${FW}" fill="url(#${id}f)"/>` +
    `<g clip-path="url(#${id}c)">` +
      (c.band ? `<path d="M20 17C30 14 40 23 44 35C34 35 23 28 20 17Z" fill="${c.band}" opacity=".88"/>` : "") +
      (c.stripes ? `<path d="M41 41C39 31 33 20 26 11M46 42C46 32 42 24 37 17M32 40C26 36 19 30 14 22" stroke="${c.edge}" stroke-width="2.4" fill="none" stroke-linecap="round"/>` : "") +
      (c.veins ? `<path d="M50 42L11 11M50 42L7 19M50 42L14 29M50 42L30 38M50 44L22 58M50 44L27 69M50 44L39 69" stroke="${c.veins}" stroke-width=".9" fill="none" opacity=".85"/>` : "") +
      (c.speck ? dots([[34, 20], [28, 28], [40, 29], [24, 16], [30, 58], [38, 55], [26, 64]], 1.1) : "") +
      `<path d="M50 41C40 30 28 22 14 14" stroke="#fff" stroke-opacity=".28" stroke-width="3" fill="none" stroke-linecap="round"/>` +
    `</g>` +
    `<path d="${FW}" fill="none" stroke="${c.edge}" stroke-width="2.4" stroke-linejoin="round"/>` +
    `<path d="${HW}" fill="none" stroke="${c.edge}" stroke-width="2.4" stroke-linejoin="round"/>` +
    dots([[11, 10], [7, 15], [9, 21], [14, 27], [22, 33]], 1.2) + dots([[20, 61], [22, 67], [28, 71], [35, 70]], 1.2);
  return `<svg viewBox="0 0 100 80" aria-hidden="true"><defs>` +
    `<linearGradient id="${id}f" gradientUnits="userSpaceOnUse" x1="50" y1="40" x2="8" y2="12"><stop offset="0" stop-color="${c.fw[0]}"/><stop offset="1" stop-color="${c.fw[1]}"/></linearGradient>` +
    `<linearGradient id="${id}h" gradientUnits="userSpaceOnUse" x1="50" y1="44" x2="24" y2="70"><stop offset="0" stop-color="${c.hw[0]}"/><stop offset="1" stop-color="${c.hw[1]}"/></linearGradient>` +
    `<clipPath id="${id}c"><path d="${FW}"/><path d="${HW}"/></clipPath></defs>` +
    `<g class="wing"><g>${wing}</g></g>` +
    `<g class="wing"><g transform="translate(100 0) scale(-1 1)">${wing}</g></g>` +
    `<rect x="48.3" y="28" width="3.4" height="27" rx="1.7" fill="#2a1a2e"/>` +
    `<ellipse cx="50" cy="31" rx="3.2" ry="4.5" fill="#3a2540"/>` +
    `<path d="M49.5 28C47 21 44 18 41 17M50.5 28C53 21 56 18 59 17" stroke="#2a1a2e" stroke-width="1" fill="none" stroke-linecap="round"/>` +
    `<circle cx="41" cy="17" r="1.3" fill="#2a1a2e"/><circle cx="59" cy="17" r="1.3" fill="#2a1a2e"/></svg>`;
}

/* Letter page logic */
(function () {
  const $ = id => document.getElementById(id);
  const C = window.CONFIG || {};
  const win = $("win"), stage = $("stage"), env = $("env"), hint = $("hint"), paper = $("paper");
  const lerp = (a, b, u) => a + (b - a) * u;
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const eo = u => 1 - Math.pow(1 - u, 3);
  const eio = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  const quad = (a, c, b, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * c + u * u * b;

  /* --- texts (all editable in config.js) --- */
  const name = C.name || "";
  const lines = C.letter || [
    "A little butterfly flew all the way across the garden just to bring you this.",
    "Behind it is a whole garden of memories, wishes and a tiny bit of magic, made only for you.",
    "Ready to see it?"
  ];
  const hintWait = C.letterHint || "Shh... something is fluttering at the window";
  const hintTap = C.letterTapHint || "A butterfly brought you a letter. Tap it";
  hint.textContent = hintWait;

  const card = $("card");
  const h = document.createElement("h2"); h.textContent = name ? "Dear " + name + "," : "Dear you,"; card.appendChild(h);
  lines.forEach(t => { const p = document.createElement("p"); p.textContent = t; card.appendChild(p); });
  const cta = document.createElement("div"); cta.className = "cta";
  const go = document.createElement("button"); go.type = "button"; go.className = "down";
  go.textContent = (C.letterButton || "Open my surprise") + " 💌"; cta.appendChild(go); card.appendChild(cta);

  /* --- ambient hearts (same as main page) --- */
  const sky = $("sky");
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span"); s.className = "heart"; s.textContent = ["💗", "🌸", "✨", "💖"][i % 4];
    s.style.cssText = `left:${Math.random() * 100}%;font-size:${14 + Math.random() * 16}px;animation-duration:${12 + Math.random() * 12}s;animation-delay:${-Math.random() * 20}s`;
    sky.appendChild(s);
  }
  /* fireflies inside the window */
  const view = $("view");
  for (let i = 0; i < 12; i++) {
    const s = document.createElement("span"); s.className = "tw";
    s.style.cssText = `left:${5 + Math.random() * 90}%;top:${5 + Math.random() * 70}%;animation-delay:${-Math.random() * 3}s;animation-duration:${2 + Math.random() * 2}s`;
    view.appendChild(s);
  }

  /* --- sparkles --- */
  function burst(x, y, n) {
    const e = ["✨", "💗", "🌸", "✦"];
    for (let i = 0; i < n; i++) {
      const s = document.createElement("i"), a = Math.random() * 6.283, d = 40 + Math.random() * 90;
      s.className = "spark"; s.textContent = e[i % 4];
      s.style.cssText = `left:${x}px;top:${y}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px`;
      document.body.appendChild(s); setTimeout(() => s.remove(), 1000);
    }
  }

  /* --- layout --- */
  let W, H, B, L = {};
  const bf = document.createElement("div");
  bf.className = "bf carrier"; bf.style.setProperty("--flap", ".36s"); bf.style.opacity = 0;
  bf.innerHTML = butterflySVG(BF_COLORS[0]);
  stage.appendChild(bf);

  function layout() {
    W = innerWidth; H = innerHeight;
    const ww = Math.min(W * .82, 350), wh = Math.min(H * .46, 420), top = Math.max(96, H * .12);
    Object.assign(win.style, { left: (W - ww) / 2 + "px", top: top + "px", width: ww + "px", height: wh + "px" });
    L = { cx: W / 2, cy: top + wh / 2, ww, wh, restY: Math.min(H - 80, top + wh + 120) };
    B = W < 600 ? 78 : 96;
    bf.style.width = B + "px"; bf.style.height = B * .8 + "px";
  }
  layout();
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layout, 120); });

  /* --- the choreography (ms) --- */
  const T = { fly: 700, open: 2400, carry: 3500, drop: 5700, settle: 6800 };
  const orbit = t => ({ x: L.cx + Math.sin(t * .0009) * Math.min(W * .34, 150), y: L.restY - 170 + Math.sin(t * .0018) * 34, s: .8 });

  let t0 = performance.now(), px = 0, sparkAt = 0, opened = false, ready = false, done = false;
  setTimeout(() => win.classList.add("curtains-open"), 150);

  function frame(now) {
    const t = now - t0;
    const start = { x: L.cx + L.ww * .34, y: L.cy - L.wh * .28 };
    const glass = { x: L.cx, y: L.cy };
    const land = { x: L.cx, y: L.restY - 150 };
    let x = start.x, y = start.y, s = .16, ex = 0, ey = 0, es = .8, er = 0, showEnv = false;

    if (t < T.fly) {
      bf.style.opacity = 0;
    } else if (t < T.open) {                       // tiny butterfly flutters toward the glass
      const u = clamp((t - T.fly) / (T.open - T.fly));
      bf.style.opacity = clamp(u * 5);
      x = lerp(start.x, glass.x, eo(u)) + Math.sin(u * 12) * 10 * (1 - u);
      y = lerp(start.y, glass.y, eo(u)) + Math.sin(u * 9) * 12 * (1 - u);
      s = lerp(.16, .3, u);
    } else if (t < T.carry) {                      // taps the glass, window swings open
      if (!opened) { opened = true; win.classList.add("open"); }
      x = glass.x + Math.sin(t * .006) * 6; y = glass.y + Math.sin(t * .008) * 5; s = .3;
    } else if (t < T.drop) {                       // flies in, carrying the envelope
      const u = clamp((t - T.carry) / (T.drop - T.carry)), e = eio(u);
      const cx = glass.x - L.ww * .55, cy = glass.y + (land.y - glass.y) * .1;
      x = quad(glass.x, cx, land.x, e); y = quad(glass.y, cy, land.y, e) + Math.sin(u * Math.PI * 5) * 10 * (1 - u);
      s = lerp(.3, 1, eo(u));
      showEnv = true; es = s * .8; ex = x; ey = y + (B * .2 + 36) * s; er = Math.sin(t * .004) * 6;
      if (now - sparkAt > 150) { sparkAt = now; burst(x, y, 2); }
    } else if (t < T.settle) {                     // lets go, envelope drops onto the room
      const u = clamp((t - T.drop) / (T.settle - T.drop)), e = eio(u), p = orbit(T.settle);
      x = lerp(land.x, p.x, e); y = lerp(land.y, p.y, e); s = lerp(1, p.s, e);
      showEnv = true;
      const sx = land.x, sy = land.y + (B * .2 + 36);
      ex = lerp(sx, L.cx, eo(u)); ey = lerp(sy, L.restY, eo(u)); es = lerp(.8, 1, eo(u));
      er = lerp(Math.sin(t * .004) * 6, -3, eo(u));
    } else {                                       // butterfly hovers, letter waits
      const p = orbit(t); x = p.x; y = p.y; s = p.s;
      showEnv = true; ex = L.cx; ey = L.restY + Math.sin(t * .002) * 3; es = 1; er = -3;
      if (!ready) {
        ready = true; env.classList.add("ready"); hint.textContent = hintTap;
        burst(L.cx, L.restY, 12);
      }
    }

    const rot = clamp((x - px) * 3, -16, 16); px = x;
    bf.style.transform = `translate3d(${x - B / 2}px,${y - B * .4}px,0) rotate(${rot}deg) scale(${s})`;
    if (showEnv) {
      env.style.opacity = 1;
      env.style.transform = `translate3d(${ex - 65}px,${ey - 45}px,0) rotate(${er}deg) scale(${es})`;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* --- open the letter --- */
  function openLetter() {
    if (!ready || done) return; done = true;
    env.classList.remove("ready"); env.classList.add("open");
    burst(L.cx, L.restY, 16); hint.style.opacity = 0;
    setTimeout(() => paper.classList.add("show"), 750);
  }
  env.addEventListener("click", openLetter);

  go.addEventListener("click", () => {
    burst(innerWidth / 2, innerHeight / 2, 14);
    document.body.classList.add("leave");
    setTimeout(() => { location.href = "main.html"; }, 700);
  });
})();
</script>
</body>
</html>
